<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garuda Indonesia · concept app</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06283a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com"><link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1d27;--mute:#5d6f79;--line:#e3e9ed;--soft:#f2f6f8;--sky:#e7f2f5;--deep:#06283a;--deep2:#0b4f66;--teal:#0f7f93;--teal-d:#0b6577;--gold:#b8924a;--red:#c23a22;--amber:#9a5b00;--green:#1b7d52;
 --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d5dfe4;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left}
input{cursor:text;outline:0}
svg{display:block}
.stage{min-height:100%;display:grid;place-items:center}
.phone{position:relative;width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--soft);overflow:hidden}
@media(min-width:520px){.stage{padding:24px}.phone{height:min(900px,calc(100dvh - 48px));border-radius:38px;box-shadow:0 30px 80px rgba(6,40,58,.3),0 0 0 10px #0c1d27}}
.view{position:absolute;inset:0 0 66px 0;overflow-y:auto;overscroll-behavior:contain;background:var(--soft);display:none}
.view.on{display:block}.view.nonav{bottom:0}.view.wh{background:#fff}
.view.enter{animation:slide .28s cubic-bezier(.3,.7,.2,1)}@keyframes slide{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.view.enter{animation:none}}
h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.12}
h2{margin:0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.sub{color:var(--mute);font-size:14px;margin-top:5px}
.pad{padding:0 20px}
.mono{font-family:var(--mono)}
/* nav */
.tabs{position:absolute;left:0;right:0;bottom:0;height:66px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:550;color:#7b8b94;position:relative}
.tabs button svg{width:23px;height:23px}.tabs button.on{color:var(--teal-d)}.tabs button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px}.tabs .badge.on{display:grid}
.nav{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-bottom)*0 + 12px) 12px 8px;background:inherit;position:sticky;top:0;z-index:4}
.nav .t{font-weight:600;font-size:16px}.nav.dk{color:#fff;background:var(--deep)}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}.back svg{width:22px;height:22px}
/* hero */
.hero{background:linear-gradient(158deg,#05243a 0%,#0a4a63 58%,#0f7f93 130%);color:#fff;padding:18px 20px 110px;position:relative;overflow:hidden}
.hero .wing{position:absolute;right:-30px;top:-20px;width:300px;height:250px;opacity:.16}
.hero .row{display:flex;align-items:center;justify-content:space-between;position:relative}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}.logo svg{width:30px;height:24px;color:#fff}
.bell{position:relative;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}.bell svg{width:21px;height:21px}
.bell .dot{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #0a4a63}.bell .dot.on{display:grid}
.hero h1{margin-top:26px;font-size:30px;position:relative}.hero .hd{font-size:13px;color:#a9cad6;margin-top:6px;position:relative}
.mem{display:inline-flex;gap:8px;align-items:center;margin-top:14px;height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:550;position:relative}.mem i{width:8px;height:8px;border-radius:50%;background:#d8b46a}
/* booking card */
.bk{margin:-84px 16px 0;background:#fff;border-radius:22px;box-shadow:0 14px 40px rgba(6,40,58,.16);position:relative;z-index:2;overflow:hidden}
.bt{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.bt button{height:48px;text-align:center;font-size:13.5px;font-weight:550;color:var(--mute);position:relative}.bt button.on{color:var(--deep)}.bt button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;background:var(--teal);border-radius:3px 3px 0 0}
.bb{padding:18px}
.ft{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center}.ft .c b{display:block;font-family:var(--mono);font-size:36px;font-weight:500;letter-spacing:-.04em;line-height:1}.ft .c small{display:block;color:var(--mute);font-size:13px;margin-top:5px}.ft .r{text-align:right}.ft svg{width:26px;height:14px;color:var(--teal);margin:0 auto 18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.fd{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:block;width:100%}.fd small{display:block;font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}.fd b{display:block;font-size:15.5px;font-weight:550;margin-top:2px}.fd input{width:100%;font-size:15.5px;font-weight:550;margin-top:2px}
.btn{height:50px;border-radius:13px;padding:0 20px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15.5px;gap:8px;width:100%}
.btn.t{background:var(--teal);color:#fff}.btn.t:active{background:var(--teal-d)}.btn.d{background:var(--deep);color:#fff}.btn.o{border:1px solid var(--line);background:#fff;color:var(--ink)}.btn.w{background:#fff;color:var(--deep)}.btn.gl{background:rgba(255,255,255,.14);color:#fff}
.btn.sm{height:42px;font-size:14.5px;border-radius:11px;width:auto}
.sec{padding:26px 20px 10px;display:flex;align-items:baseline;justify-content:space-between}.sec h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}.sec small{color:var(--teal-d);font-weight:550;font-size:13.5px}
/* trip card */
.tc{margin:0 16px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(6,40,58,.07);display:block;width:calc(100% - 32px)}
.tc .art{position:relative;height:118px}.tc .art svg.bg{position:absolute;inset:0;width:100%;height:100%}
.tc .ov{position:absolute;inset:0;padding:14px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.tc .ov .a{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.92}
.tc .ov .b{display:flex;align-items:flex-end;justify-content:space-between}.tc .ov b{font-family:var(--mono);font-size:32px;font-weight:500;letter-spacing:-.04em;line-height:1}.tc .ov svg{width:40px;height:12px;margin-bottom:9px;opacity:.8}
.tc .inf{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 18px;gap:6px}.tc .inf small{display:block;font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}.tc .inf b{font-size:15.5px;font-weight:550;font-family:var(--mono)}
.tc .ft2{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-size:13.5px}.tc .ft2 .cd{color:var(--mute)}.tc .ft2 .cd b{color:var(--ink);font-weight:600}
.tc .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}.chip.ok{background:#e1f3ea;color:var(--green)}.chip.warn{background:#fcefd9;color:var(--amber)}.chip.bad{background:#fbe6e1;color:var(--red)}
/* explore */
.ex{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none}.ex::-webkit-scrollbar{display:none}
.dc{flex:none;width:152px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(6,40,58,.07);display:block}
.dc .im{height:132px;position:relative}.dc .im svg{position:absolute;inset:0;width:100%;height:100%}.dc .tx{padding:11px 13px 13px}.dc b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}.dc small{color:var(--mute);font-size:12.5px}.dc em{font-style:normal;display:block;margin-top:6px;font-size:13px}.dc em b{display:inline;font-family:var(--mono);font-size:13.5px;font-weight:500}
.mc{margin:6px 16px 0;border-radius:18px;background:linear-gradient(135deg,#1a2f3a,#0c1d27);color:#fff;padding:18px;position:relative;overflow:hidden}
.mc .k{font-size:11px;letter-spacing:.14em;color:#d8b46a;font-weight:600;text-transform:uppercase}.mc b{display:block;font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.03em;margin-top:8px}.mc .bar{height:5px;background:rgba(255,255,255,.14);border-radius:3px;margin-top:14px;overflow:hidden}.mc .bar i{display:block;width:62%;height:100%;background:#d8b46a}.mc small{display:block;margin-top:9px;color:#a7b8c1;font-size:12.5px}
.fine{color:var(--mute);font-size:11.5px;padding:20px 20px 26px;line-height:1.5}
/* search */
.sh{background:#fff;padding:calc(env(safe-area-inset-bottom)*0 + 18px) 20px 6px}
.dr{display:flex;align-items:center;gap:14px;width:100%;padding:11px 20px;background:#fff}.dr.sel{background:var(--sky)}
.dr .th{width:54px;height:54px;border-radius:13px;overflow:hidden;position:relative;flex:none}.dr .th svg{position:absolute;inset:0;width:100%;height:100%}
.dr b{display:block;font-size:16px;font-weight:600}.dr small{color:var(--mute);font-size:13px}.dr .p{margin-left:auto;text-align:right}.dr .p small{display:block;font-size:11px}.dr .p b{font-family:var(--mono);font-size:14px;font-weight:500}
.rad{width:20px;height:20px;border-radius:50%;border:1.5px solid #b9c6cd;flex:none;margin-left:6px}.sel .rad{border:6px solid var(--teal)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:none;background:#fff}.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:64px;padding:9px 0 9px;border-radius:13px;border:1px solid var(--line);text-align:center;background:#fff}.strip small{display:block;font-size:11px;color:var(--mute)}.strip b{display:block;font-size:18px;font-weight:600;margin:1px 0;letter-spacing:-.02em}.strip em{font-style:normal;font-size:11px;color:var(--mute);font-family:var(--mono)}.strip em.lo{color:var(--green);font-weight:600}
.strip button.on{background:var(--deep);border-color:var(--deep);color:#fff}.strip button.on small,.strip button.on em{color:#bcd9e4}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;margin:4px 20px 0}.seg button{height:38px;border-radius:9px;text-align:center;font-size:14px;font-weight:550;color:var(--mute)}.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 3px rgba(6,40,58,.15)}
.step{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#fff}.step b{font-size:16px;font-weight:550}.step small{display:block;color:var(--mute);font-size:12.5px;font-weight:400}.step .n{display:flex;align-items:center;gap:14px}.step .n button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;text-align:center;line-height:1}.step .n span{font-family:var(--mono);font-size:18px;min-width:14px;text-align:center}
.foot{position:sticky;bottom:0;padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);background:#fff;border-top:1px solid var(--line);z-index:3}
/* results */
.rh{background:var(--deep);color:#fff;padding:0 20px 16px}.rh .r{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.03em}.rh .r svg{width:24px;height:12px;color:#7fb1c3}.rh .m{color:#a9cad6;font-size:13px;margin-top:4px}
.res{padding:12px 16px 24px;display:grid;gap:12px}
.fl{background:#fff;border-radius:18px;padding:16px 16px 14px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(6,40,58,.06)}
.fl .a{display:flex;align-items:center;justify-content:space-between}.fl .tm{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.03em}.fl .tm sup{font-size:11px;color:var(--teal-d);margin-left:2px}.fl .tm small{display:block;font-size:11.5px;color:var(--mute);font-family:var(--font);letter-spacing:0;font-weight:400}
.fl .ln{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 12px;color:var(--mute);font-size:11.5px}.fl .ln i{display:block;height:1px;background:#c6d2d8;width:100%;margin:5px 0;position:relative}.fl .ln i::after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid #aebcc4;border-right:1px solid #aebcc4;transform:rotate(45deg)}
.fl .mt{display:flex;align-items:center;gap:8px;margin:10px 0 12px;font-size:12.5px;color:var(--mute)}.fl .mt .lg{width:20px;height:20px;border-radius:5px;background:#fff;display:grid;place-items:center;overflow:hidden}.fl .mt .lg img{width:100%;height:100%;object-fit:contain}
.cab{display:grid;gap:8px}.cab.c3{grid-template-columns:repeat(3,1fr)}.cab.c2{grid-template-columns:repeat(2,1fr)}
.cab button{border:1px solid var(--line);border-radius:13px;padding:9px 10px 10px;text-align:left;background:#fff}.cab small{display:block;font-size:11px;color:var(--mute);font-weight:550}.cab b{display:block;font-family:var(--mono);font-size:14.5px;font-weight:500;margin-top:3px;letter-spacing:-.02em}.cab em{font-style:normal;font-size:10.5px;color:var(--red);font-weight:600;display:block;margin-top:1px}
.cab button.pref{border-color:var(--teal);background:var(--sky)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(6,40,58,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.7,.2,1);z-index:21;max-height:88%;overflow-y:auto}.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#d3dbe0;margin:0 auto 14px}
.fam{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;display:block;width:100%}.fam.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:#fbfeff}
.fam .h{display:flex;justify-content:space-between;align-items:baseline}.fam .h b{font-size:16px;font-weight:600}.fam .h span{font-family:var(--mono);font-size:15px;font-weight:500}
.fam ul{margin:8px 0 0;padding:0;list-style:none;color:var(--mute);font-size:13px;display:grid;gap:4px}.fam li{display:flex;gap:8px}.fam li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--teal);margin-top:7px;flex:none;opacity:.6}
/* review */
.blk{background:#fff;margin:12px 16px 0;border-radius:18px;padding:16px 18px}
.blk h2{margin-bottom:12px}
.pr{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px;color:var(--mute)}.pr b{color:var(--ink);font-weight:500;font-family:var(--mono)}.pr.t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--ink);font-weight:600}.pr.t b{font-size:18px;font-weight:600}
.pay{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:550}.pay:last-child{border:0}.pay .ic{width:34px;height:24px;border-radius:5px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.04em}.pay .rad{margin-left:auto}.pay.sel .rad{border:6px solid var(--teal)}
.okw{display:grid;place-items:center;padding:46px 20px 6px}.okc{width:72px;height:72px;border-radius:50%;background:#e1f3ea;display:grid;place-items:center;color:var(--green)}.okc svg{width:36px;height:36px}
/* trip detail */
.th{position:relative;color:#fff;padding:0 20px 24px;background:var(--deep)}.th svg.bg{position:absolute;inset:0;width:100%;height:100%}.th>*:not(svg){position:relative}
.th .rr{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}.th .rr b{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.045em;line-height:1}.th .rr small{display:block;font-size:13px;color:#cfe3ea;margin-top:6px}.th .rr svg{width:56px;height:14px;margin-bottom:24px;opacity:.7}
.th .cd{margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);height:32px;padding:0 13px;border-radius:16px;font-size:13.5px;font-weight:550}.th .cd i{width:8px;height:8px;border-radius:50%;background:#43d18b}.th .cd.warn i{background:#ffb84a}.th .cd.bad i{background:#ff7a68}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-24px 16px 0;position:relative;z-index:2}
.qa button{background:#fff;border-radius:16px;padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:550;text-align:center;box-shadow:0 8px 22px rgba(6,40,58,.12)}.qa svg{width:24px;height:24px;color:var(--teal)}
.tl{margin:20px 20px 0;position:relative;padding-left:24px;background:#fff;border-radius:18px;padding:20px 20px 4px 44px}.tl::before{content:"";position:absolute;left:25px;top:30px;bottom:44px;width:2px;background:repeating-linear-gradient(#b9c9d1 0 4px,transparent 4px 8px)}
.tl .s{position:relative;padding-bottom:22px}.tl .s::before{content:"";position:absolute;left:-26px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--teal)}.tl .s.e::before{background:var(--teal)}
.tl .t{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.03em}.tl .t s{font-size:13px;color:var(--mute);margin-left:8px}.tl .t em{font-style:normal;color:var(--red);margin-left:8px;font-size:13px;font-weight:600}.tl .t sup{font-size:11px;color:var(--teal-d)}
.tl .c{font-size:15.5px;font-weight:600;margin-top:2px}.tl .d{font-size:13px;color:var(--mute);margin-top:2px}.tl .fl2{margin:-6px 0 18px;font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:1fr 1fr;margin:12px 16px 0;background:#fff;border-radius:18px;padding:4px 18px}.kv div{padding:13px 0;border-bottom:1px solid var(--line)}.kv div:nth-last-child(-n+2){border:0}.kv small{display:block;font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}.kv b{font-size:16.5px;font-weight:550;font-family:var(--mono)}
/* pass */
.pw{background:linear-gradient(180deg,var(--deep) 0,var(--deep) 210px,#e5eef2 210px);min-height:100%}
.pass{margin:2px 16px 0;border-radius:22px;background:#fff;box-shadow:0 18px 44px rgba(6,40,58,.22);overflow:hidden}

const MCT=(a,b)=>{const za=CT[a.from].z,zb=CT[b.to].z;let m=za==='D'&&zb==='D'?50:za!==zb?90:75;if(a.term!==b.term)m+=30;return m};
const _sc={};
function search(o,d,X){if(!CT[o]||!CT[d]||o===d)return [];const k=o+d+X;if(_sc[k])return _sc[k];let r=[];
 if(o===HUB)r=legsDep(o,X).filter(l=>l.to===d).map(l=>[l]);

 const out=r.map(L=>({legs:L,dep:L[0].dep,arr:L[L.length-1].arr,dur:L[L.length-1].arr-L[0].dep,stops:L.length-1,key:L.map(l=>l.id+'|'+l.dep).join('>')})).sort((a,b)=>a.dep-b.dep).slice(0,14);
 return _sc[k]=out}
/* ---- fares: distance (block time) x time of day x days out x seeded demand; cabins, families and rules on top ---- */
const RULES={

try{const sv=JSON.parse(localStorage.getItem('ga-pricing-cfg')||'null');if(sv)for(const g in sv)if(PRICE_CFG[g])Object.assign(PRICE_CFG[g],sv[g])}catch(e){}
function todFactor(m,C=PRICE_CFG.tod){return (m>=C.peakFrom1&&m<=C.peakTo1)||(m>=C.peakFrom2&&m<=C.peakTo2)?C.peak:(m>=C.offFrom||m<C.offTo?C.off:1)}

const SEASON_WINDOWS=[{k:'xmas',label:'Year-end holidays',from:'2026-12-19',to:'2027-01-04'},{k:'cny',label:'Chinese New Year',from:'2027-02-03',to:'2027-02-10'},{k:'lebaran',label:'Lebaran (Idul Fitri), approximate',from:'2027-03-03',to:'2027-03-16'},{k:'school',label:'Mid-year school holidays',from:'2027-06-19',to:'2027-07-18'}].map(w=>({...w,a:dnOf(w.from),b:dnOf(w.to)}));

function curveF(d,C=PRICE_CFG.curve){const P=[[0,C.d0],[1,C.d1],[3,C.d3],[7,C.d7],[14,C.d14],[21,C.d21],[30,C.d30],[60,C.d60]];if(d<=0)return P[0][1];for(let i=1;i<P.length;i++)if(d<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0])}return P[P.length-1][1]}
/* Seat inventory and load: capacity from the cabin layout, an expected final load factor per flight, a sold-share curve by days out, and a price ladder that climbs as the cabin fills */

function pwl(P,x){if(x<=P[0][0])return P[0][1];for(let i=1;i<P.length;i++)if(x<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return P[P.length-1][1]}

function loadInfo(l,cabin){const C=PRICE_CFG,L=C.load,t=lp(l.dep,l.from),dout=t.day-TD,cap=cabinCap(l,cabin),idx=todFactor(t.min)*C.dow[DOW_KEYS[isoDow(t.day)-1]]*seasonOf(t.day).f,base=cabin==='Business'?L.lfBusiness:cabin==='Premium'?L.lfPremium:L.lfEconomy,

 const tiles=[['Films','<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M4 11h16M8 7l-2 4M13 7l-2 4M18 7l-2 4"/>'],['TV','<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6"/>'],['Music','<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>'],['Games','<rect x="3" y="8" width="18" height="9" rx="4"/><path d="M8 10.5v4M6 12.5h4M16 11h.01M18 13.5h.01"/>'],['Flight map','<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>']];
 const seatCard=e.kind==='trip'?`<div class="eco-seatcard"><small>Your trip · ${e.id} · ${e.from} to ${e.to}</small><b>${e.seat?'Seat '+e.seat+', ':''}${e.ac}</b><p>View your seat and choose an available seat when your fare allows.</p><button class="eco-btn" data-eco-seat>View seat map</button></div>`:`<div class="eco-seatcard"><small>Choosing a seat</small><b>Lite, Value, Standard or Flexi</b><p>With Lite and Value your seat is given at check-in. With Standard and Flexi you choose it for free.</p><button class="eco-btn" data-eco-back>Back to fares</button></div>`;
 $('#v-economy').innerHTML=`<div class="eco-nav"><button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><span>Economy</span></div>
 <div class="eco-hero ${ph?'':'plain'}">${ph?im('rest','A passenger reclined in an Economy window seat, wearing headphones').replace('loading="lazy" ',''):''}<div class="t"><small>${acName(e.ac)}</small><h1>Economy</h1><p>A seat to settle into, a screen of your own, and the window beside you.</p><div class="eco-chips">${EF.map(n=>`<span>${n}</span>`).join('')}</div></div></div>
 <nav class="eco-jump" aria-label="On this page">${[['seat','Seat'],ph?['meals','Meals']:null,['ent','Entertainment'],ph?['crew','Service']:null,ph?['rest','Rest']:null,['inc','Fares']].filter(Boolean).map(([k,l])=>`<button data-eco-jump="${k}">${l}</button>`).join('')}</nav>
 <section class="eco-s" id="eco-seat"><h2>Settle in</h2><p class="eco-lead">A reclining seat with an adjustable headrest, and window or aisle to choose from.</p>
  <div class="eco-facts"><div><b>Reclining seat</b><small>Adjustable headrest</small></div><div><b>Window or aisle</b><small>Set your preference</small></div><div><b>Your own screen</b><small>Films, TV, music, games</small></div><div><b>Ports at the seat</b><small>USB-C and USB-A</small></div></div>
  ${ph?`<div class="eco-shot" style="margin-top:22px">${im('seat','Seatback screen, ports and cup holder on a widebody Economy seat')}${ECO_PINS.map((x,i)=>`<button class="eco-pin" style="left:${x.x}%;top:${x.y}%" data-eco-pin="${i}" aria-pressed="${i===ecoPin}" aria-label="${x.t}">${i+1}</button>`).join('')}</div>
  <div class="eco-cap" aria-live="polite"><i>${ecoPin+1}</i><div><b>${pin.t}</b><p>${pin.p}</p></div></div>
  <div class="eco-shot">${im('cabin','A widebody Economy cabin with teal seats')}</div><p class="eco-note">Teal seats with the Garuda wing on every headrest. Illustrative image of a Garuda widebody Economy cabin.</p>`:`<p class="eco-note" style="margin-top:16px">${acName(e.ac)} is a narrowbody, so its Economy cabin is different from our widebody photos. Photos are coming. The fares and baggage details below apply to Economy on every flight.</p>`}</section>
 ${ph?`<section class="eco-s" id="eco-meals"><h2>Eat and drink</h2><p class="eco-lead">A meal and a drink on the flight. What is served depends on the route and the time of day.</p><div class="eco-shot">${im('meal','A passenger eating a meal at a window seat')}</div><div class="eco-shot">${im('meal-close','A main meal on the tray: rice, curry, vegetables, fruit, a sweet and tea')}</div><p class="eco-note">Example of a main meal. Menus vary by route. Illustrative image.</p></section>`:''}
 <section class="eco-s" id="eco-ent"><h2>Entertainment</h2><p class="eco-lead">Films, TV, music, games and a live flight map, on your own screen.</p><div class="eco-tiles">${tiles.map(([l,p])=>`<div>${ico(p)}${l}</div>`).join('')}</div></section>
 ${ph?`<section class="eco-s" id="eco-crew"><h2>Service</h2><p class="eco-lead">Our cabin crew look after you through the flight.</p><div class="eco-shot">${im('crew','A cabin crew member in a teal kebaya serving a passenger')}</div><p class="eco-note">Illustrative image.</p></section>
 <div class="eco-dark" id="eco-rest"><h2>Rest</h2><p class="eco-lead">Lights go low so you can rest. Recline, put your headphones on, and sleep.</p><div class="eco-shot">${im('night','A passenger asleep under a blanket in a dimly lit cabin')}</div><p class="eco-note">Illustrative image.</p></div>`:''}
 <section class="eco-s" id="eco-inc"><h2>What is included</h2><p class="eco-lead">Four Economy fares. The cabin is the same, the flexibility is not.</p>
  <div class="eco-tbl"><table><thead><tr><th></th>${EF.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${[['Cabin bag','bag'],['Checked bag','chk'],['Seat','seat'],['Changes','chg'],['Refund','ref'],['Miles','mil']].map(([l,k])=>`<tr><td>${l}</td>${ER.map(r=>`<td class="${['Not included','Not refundable','Not allowed'].includes(r[k])?'n':''}">${ecoShort(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="eco-note">Amounts in IDR.</p></section>
 ${seatCard}
 <section class="eco-s" style="padding-top:28px"><h2>Good to know</h2><div style="margin-top:12px"><details><summary>Travelling with children or an infant${HOME_CHEVRON}</summary><p>Children (2 to 11) pay 75% of the adult fare and have their own seat. Infants under 2 travel on an adult’s lap and pay 10%.</p></details><details><summary>Baggage allowance${HOME_CHEVRON}</summary><p>Lite includes a cabin bag only. Value adds a checked bag of ${ER[1].chk}. Standard and Flexi include ${ER[2].chk}.</p></details><details><summary>Check-in and boarding${HOME_CHEVRON}</summary><p>Online check-in opens 48 hours before departure and closes 60 minutes before international flights, 45 minutes before domestic ones.</p></details></div></section>
 <p class="eco-foot">${ph?'Cabin photos show our widebody Economy cabin (A330-900, A350, 787-9). Narrowbody aircraft such as the 737-800 are different, and their photos are coming. ':''}Concept prototype, simulated and not affiliated with Garuda Indonesia.</p>`}
$('#v-economy').addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('[data-eco-pin]')){ecoPin=+b.dataset.ecoPin;const y=$('#v-economy').scrollTop;renderEconomy();$('#v-economy').style.scrollBehavior='auto';$('#v-economy').scrollTop=y;$('#v-economy').style.scrollBehavior='';$('#v-economy [data-eco-pin="'+ecoPin+'"]').focus({preventScroll:true})}
 else if(b=t.closest('[data-eco-jump]'))document.getElementById('eco-'+b.dataset.ecoJump)?.scrollIntoView({block:'start'});
 else if(t.closest('[data-eco-back]'))back();
 else if(t.closest('[data-eco-seat]')){const ctx=S.eco;tripTab.tab='manage';tripServiceSelection={ref:BK().ref,leg:ctx.leg??0,person:ctx.person??0};back();setTimeout(()=>openTripService('seat'),80)}});
$('#v-trip').addEventListener('click',e=>{if(!e.target.closest('[data-eco-trip]'))return;const b=BK(),l=tripCurrentLeg(b);if(!l)return;openEconomy({kind:'trip',ac:l.ac,id:l.id,from:l.from,to:l.to,leg:flat(b).indexOf(l),person:0,seat:travellerSeat(b,l,0)})});
/* ================= operations demo (what the airport console would send) ================= */
function toast(t,p){const el=$('#push');el.innerHTML=`<span class="lg">${GL()}</span><div style="min-width:0"><b>${t}</b><p>${p}</p></div><small>now</small>`;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),3800)}
function ops(kind){if(kind==='reset'){reset();S.stack=['home'];go('home',false);badge();closeSheet();return}const b=BK()||B0();if(!b){closeSheet();toast('Create a trip first','Demo updates apply to a booking you create.');return}const l=fleg(b),M=(k,ti,p,g)=>S.msgs.unshift({id:Date.now(),kind:k,t:ti,p,bookingRef:b.ref,legIndex:flat(b).indexOf(l),flightKey:noticeKey(l),atAbs:nowAbs(),at:'now',unread:true,go:g});l.rebooked=null;l.decision=null;S.opt=null;
 if(kind==='delay'||kind==='delay120'||kind==='delay240'){l.status='delay';l.delay=kind==='delay120'?120:kind==='delay240'?240:45;M('warn',l.id+' is delayed '+l.delay+' minutes','New departure '+fT(eD(l),l.from)+' · '+cname(l.from)+' local time. Open the update for details.','notice');toast(l.id+' is delayed '+l.delay+' min','New departure '+fT(eD(l),l.from)+' · gate '+l.gate)}
 else if(kind==='gate'){const old=l.gate;l.gate=l.gate[0]+(parseInt(l.gate.slice(1))+3);l.gateChange={from:old,to:l.gate};M('info','Gate change',l.id+' now departs from gate '+l.gate+' (was '+old+').','notice');toast('Gate change · '+l.id,'Now gate '+l.gate+' (was '+old+')')}
 else if(kind==='boarding'){l.status='boarding';M('info','Boarding now',l.id+' is boarding at gate '+l.gate+'. Gate closes at '+fT(eD(l)-15,l.from)+'.','pass');toast('Boarding now · '+l.id,'Gate '+l.gate)}
 else if(kind==='cancel'){if(l.status!=='cancel')adjustSold(l,bookingCabin(b,l),-seats(b.q));l.status='cancel';M('bad',l.id+' is cancelled','Review your available options for this flight.','notice');toast(l.id+' is cancelled','Review your available options')}
 else return;
 render(S.stack[S.stack.length-1]);badge();closeSheet()}
$('#demoBtn').onclick=()=>{if(!BK()){$('#sheet').innerHTML='<div class="grab"></div><h1 style="font-size:23px">Start with a journey.</h1><p class="sub">Create a booking, then try delays, gate changes and boarding updates here.</p><button class="btn t" style="margin-top:20px" data-go="search" data-close>Find a flight</button>';openSheet();return}$('#sheet').innerHTML=`<div class="grab"></div><b style="font-size:20px;font-weight:600;letter-spacing:-.02em">Operations demo</b><p class="sub">In the full version these come from the airport console. Try one and watch the trip change.</p><div class="dm">
 <button data-ops="delay">${I('<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>')}<span>Delay the next flight 45 minutes<small>New time and fare conditions</small></span></button>
 <button data-ops="delay120">${I('<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>')}<span>Delay the next flight 2 hours<small>See waiting assistance and fare conditions</small></span></button>
 <button data-ops="delay240">${I('<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>')}<span>Delay the next flight 4 hours<small>See longer-delay assistance and simulated rebooking</small></span></button>
 <button data-ops="gate">${I('<path d="M5 12h14M13 6l6 6-6 6"/>')}<span>Change the gate<small>The pass and trip update</small></span></button>
 <button data-ops="boarding">${I('<path d="M8 12.5l3 3 5-6"/><circle cx="12" cy="12" r="9"/>')}<span>Start boarding<small>Boarding now at the gate</small></span></button>
 <button data-ops="cancel">${I('<circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>')}<span>Cancel the flight<small>Rebook, or refund</small></span></button>
 <button data-ops="reset">${I('<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/>')}<span>Clear demo trips<small>Remove trips and updates from this session</small></span></button></div>`;openSheet()};
/* deep links for review: ?s=search|pick|results|review|done|trip|pass|inbox|notice &from=SYD&to=KIX &one=1 &step=1 &sheet=fare|det|cmp|cal &demo=delay */
(()=>{const u=new URLSearchParams(location.search),q=S.q;if(u.get('from'))q.from=u.get('from');if(u.get('to'))q.to=u.get('to');if(u.get('one'))q.type='one';if(u.get('a'))q.a=+u.get('a');if(u.get('c'))q.c=+u.get('c');if(u.get('i'))q.i=+u.get('i');
 const s=u.get('s');go('home');const d=u.get('demo');if(d)ops(d);
 const auto=()=>{[0,1].slice(0,q.type==='ret'?2:1).forEach(k=>{S.step=k;const l=listFor();if(l.its[0]){const c=fares(l.its[0])[0];S.sel[k]={it:l.its[0],cab:c.k,fam:c.fam[0]}}});S.step=0};
 if(s==='review')auto();
 if(s==='results'&&u.get('step')==='1'){S.step=0;const l=listFor();if(l.its[0]){const c=fares(l.its[0])[0];S.sel[0]={it:l.its[0],cab:c.k,fam:c.fam[0]};S.step=1}}

 if(s&&$('#v-'+s)){if(TABS.includes(s))S.stack=[s];go(s)}
 const sh=u.get('sheet');if(sh==='cal')calSheet();else if(sh&&s==='results'){S.cur={i:+(u.get('i')||0),ci:+(u.get('ci')||0)};S.fi=0;sh==='det'?detSheet(curIt()):sh==='cmp'?cmpSheet():fareSheet()}})();
</script>
