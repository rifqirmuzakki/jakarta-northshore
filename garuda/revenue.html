<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demand and revenue · Garuda concept</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://api.fontshare.com"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
<link rel="stylesheet" href="revenue.css?v=943feac9">
</head>
<body>
<header class="top">
 <div class="brand"><img src="assets/garuda-logo-white.svg" alt="Garuda Indonesia" height="26"><span>Demand and revenue</span></div>
 <div class="who"><span id="clock"></span><a href="agent.html">Sales counter</a><a href="pricing-lab.html">Pricing Lab</a><a href="index.html">Passenger app</a></div>
</header>
<div id="boot" class="boot">Starting the simulation…</div>
<main id="app" hidden>
 <section class="filters" aria-label="Filters">
  <div class="seg" role="group" aria-label="Days shown" id="f-range"></div>
  <div class="seg" role="group" aria-label="Cabin" id="f-cabin"></div>
  <span class="status" id="status" role="status" aria-live="polite"></span>
 </section>
 <section class="tiles" id="tiles" aria-label="Totals for the selected day"></section>
 <section class="panel">
  <h2 id="h-outlook">Outlook</h2>
  <div class="two">
   <figure class="chart" id="c-lf"><figcaption>Load factor by departure day</figcaption><div class="plot"></div></figure>
   <figure class="chart" id="c-rev"><figcaption>Revenue by departure day</figcaption><div class="plot"></div></figure>
  </div>
  <details class="tv"><summary>Table view</summary><div class="tw" id="t-outlook"></div></details>
 </section>
 <section class="panel">
  <h2 id="h-day">Flights</h2>
  <div class="two">
   <figure class="chart" id="c-chan"><figcaption>Revenue by sales channel</figcaption><div class="plot"></div></figure>
   <figure class="chart" id="c-curve"><figcaption id="cap-curve">Booking curve</figcaption><div class="plot"></div><div class="legend" id="lg-curve"></div></figure>
  </div>
  <details class="tv"><summary>Table view of the booking curve</summary><div class="tw" id="t-curve"></div></details>
  <div class="detail" id="detail"></div>
  <div class="tw"><table id="flights" class="grid"></table></div>
  <button type="button" class="more" id="more" hidden>Show more flights</button>
 </section>
</main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<iframe id="eng" src="index.html?v=10da15d5" title="Simulation engine" aria-hidden="true" tabindex="-1" style="position:absolute;left:-10000px;top:0;width:390px;height:844px;border:0"></iframe>
<script src="store.js"></script>
<script src="revenue.js?v=76d49fe1"></script>
</body>
</html>
